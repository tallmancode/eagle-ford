networks:
  internal:

services:
  app:
    image: ${APP_IMAGE:-eagle-ford-app:latest}
    ports:
      - '127.0.0.1:${APP_HOST_PORT:-4411}:3000'
    env_file:
      - .env
    volumes:
      - media_uploads:/app/public/media
    networks:
      - internal
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  # Polls Payload jobs so pending Motor City lead forwards are retried with backoff.
  lead-jobs:
    image: curlimages/curl:8.12.1
    env_file:
      - .env
    networks:
      - internal
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        if [ -z "$$CRON_SECRET" ]; then
          echo "lead-jobs: CRON_SECRET is not set; refusing to start"
          exit 1
        fi
        echo "lead-jobs: polling motor-city-leads every 60s"
        while true; do
          curl -sf \
            -H "Authorization: Bearer $$CRON_SECRET" \
            "http://app:3000/api/payload-jobs/run?queue=motor-city-leads&limit=10" \
            || echo "lead-jobs: motor-city-leads run request failed"
          sleep 60
        done

  mongo:
    image: mongo:8
    ports:
      - '127.0.0.1:${MONGO_HOST_PORT:-4422}:27017'
    command:
      - --storageEngine=wiredTiger
      - --quiet
    volumes:
      - data:/data/db
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  data:
  media_uploads:
