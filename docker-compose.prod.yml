networks:
  internal:

services:
  app:
    image: ${APP_IMAGE:-eagle-ford-app:latest}
    ports:
      - '127.0.0.1:${APP_HOST_PORT:-4411}:3000'
    env_file:
      - .env
    volumes:
      - media_uploads:/app/public/media
    networks:
      - internal
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      # wget avoids spawning a new Node process every interval (memory spikes).
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1']
      interval: 75s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Polls Payload jobs so pending Motor City lead forwards are retried with backoff.
  lead-jobs:
    image: curlimages/curl:8.12.1
    env_file:
      - .env
    networks:
      - internal
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        if [ -z "$$CRON_SECRET" ]; then
          echo "lead-jobs: CRON_SECRET is not set; refusing to start"
          exit 1
        fi
        echo "lead-jobs: polling motor-city-leads every 5m"
        while true; do
          curl -sf \
            -H "Authorization: Bearer $$CRON_SECRET" \
            "http://app:3000/api/payload-jobs/run?queue=motor-city-leads&limit=10" \
            || echo "lead-jobs: motor-city-leads run request failed"
          sleep 300
        done
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://app:3000/api/health']
      interval: 90s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  mongo:
    image: mongo:8
    ports:
      - '127.0.0.1:${MONGO_HOST_PORT:-4422}:27017'
    command:
      - --storageEngine=wiredTiger
      - --quiet
    volumes:
      - data:/data/db
      - configdb:/data/configdb
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 60s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  data:
  configdb:
  media_uploads:
