networks:
  internal:

services:
  app:
    image: ${APP_IMAGE:-eagle-ford-app:latest}
    ports:
      - '127.0.0.1:${APP_HOST_PORT:-4411}:3000'
    env_file:
      - .env
    volumes:
      - media_uploads:/app/public/media
    networks:
      - internal
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  mongo:
    image: mongo:7.0
    ports:
      - '127.0.0.1:${MONGO_HOST_PORT:-4422}:27017'
    command:
      - --storageEngine=wiredTiger
      - --quiet
    volumes:
      - data:/data/db
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  data:
  media_uploads:
