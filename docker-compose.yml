services:
  payload:
    image: node:22.17.0-alpine
    ports:
      - '3001:3001'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    command: sh -c "apk add --no-cache libc6-compat && corepack enable && corepack prepare pnpm@11.8.0 --activate && pnpm install --frozen-lockfile && pnpm dev"
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: mongodb://mongo:27017/eagle-ford
      NEXT_PUBLIC_SERVER_URL: http://localhost:3001

  mongo:
    image: mongo:7.0
    ports:
      - '127.0.0.1:27017:27017'
    command:
      - --storageEngine=wiredTiger
    volumes:
      - data:/data/db
    logging:
      driver: none
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  data:
  node_modules:
