name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      skip_rebuild:
        description: 'Skip Docker image rebuild (restart containers only)'
        type: boolean
        default: false

env:
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45

    steps:
      - name: Validate required secrets
        env:
          _SSH_KEY: ${{ secrets.SSH_KEY }}
          _SSH_HOST: ${{ secrets.SSH_HOST }}
          _SSH_USER: ${{ secrets.SSH_USER }}
          _APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          missing=0
          if [ -z "$_SSH_KEY" ]; then
            echo "::error::Missing SSH_KEY (set on the staging environment)"
            missing=1
          fi
          if [ -z "$_SSH_HOST" ]; then
            echo "::error::Missing SSH_HOST (set on the staging environment)"
            missing=1
          fi
          if [ -z "$_SSH_USER" ]; then
            echo "::error::Missing SSH_USER (set on the staging environment)"
            missing=1
          fi
          if [ -z "$_APP_ENV" ]; then
            echo "::error::Missing APP_ENV (set on the staging environment)"
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add server to known hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to Server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          APP_ENV: ${{ secrets.APP_ENV }}
          APP_DIR: ${{ secrets.APP_DIR || '/www/wwwroot/eagle/ford/staging' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -e

          SSH_OPTS="-p $SSH_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=60"
          SCP_OPTS="-P $SSH_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=60"
          DEPLOY_BRANCH="staging"
          ENV_FILE="$(mktemp)"
          trap 'rm -f "$ENV_FILE"' EXIT

          printf '%s\n' "$APP_ENV" > "$ENV_FILE"
          if [ ! -s "$ENV_FILE" ]; then
            echo "::error::Failed to write APP_ENV to temp file"
            exit 1
          fi
          if grep -q '^PAYLOAD_CONFIG_PATH=' "$ENV_FILE"; then
            echo "::error::PAYLOAD_CONFIG_PATH must not be set in APP_ENV for Docker deploy."
            exit 1
          fi

          echo "========================================"
          echo "Syncing repository on $APP_DIR"
          echo "========================================"

          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "
            set -e

            [ -f ~/.bashrc ] && source ~/.bashrc || true
            [ -f ~/.bash_profile ] && source ~/.bash_profile || true
            [ -f ~/.profile ] && source ~/.profile || true

            SERVER_PATH='$APP_DIR'

            git config --global --add safe.directory \"\$SERVER_PATH\"
            mkdir -p \"\$SERVER_PATH\"

            if [ ! -d \"\$SERVER_PATH/.git\" ]; then
              echo 'Cloning repository...'
              git clone git@github.com:$GITHUB_REPOSITORY.git \"\$SERVER_PATH\"
              cd \"\$SERVER_PATH\"
              git checkout '$DEPLOY_BRANCH' || git checkout -b '$DEPLOY_BRANCH' origin/'$DEPLOY_BRANCH'
            else
              echo 'Pulling latest changes...'
              cd \"\$SERVER_PATH\"
              git fetch origin
              git reset --hard origin/'$DEPLOY_BRANCH'
            fi

            echo 'Repository updated successfully'
          "

          echo 'Uploading .env to server...'
          scp $SCP_OPTS "$ENV_FILE" "$SSH_USER@$SSH_HOST:$APP_DIR/.env"
          echo "✓ .env file uploaded"

          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "
            set -e

            [ -f ~/.bashrc ] && source ~/.bashrc || true
            [ -f ~/.bash_profile ] && source ~/.bash_profile || true
            [ -f ~/.profile ] && source ~/.profile || true

            cd '$APP_DIR'

            if [ -f .env ]; then
              for pair in \
                'NEXT_PUBLIC_SERVER_URL=https://ford-stg.tallmancode.co.za' \
                'SENTRY_ENVIRONMENT=staging' \
                'NEXT_PUBLIC_SENTRY_ENVIRONMENT=staging' \
                'APP_HOST_PORT=5411' \
                'MONGO_HOST_PORT=5422' \
                'APP_IMAGE=eagle-ford-app:staging' \
                'COMPOSE_PROJECT_NAME=eagle-ford-staging' \
                'ALLOW_SEARCH_INDEXING=false' \
                'MOTOR_CITY_STOCK_API_URL=https://motor-city-stg.tallmancode.co.za'
              do
                key=\${pair%%=*}
                val=\${pair#*=}
                if grep -q \"^\${key}=\" .env; then
                  sed -i \"s|^\${key}=.*|\${key}=\${val}|\" .env
                else
                  printf '\\n%s=%s\\n' \"\$key\" \"\$val\" >> .env
                fi
              done
              echo '✓ Staging env overrides applied'
            fi

            if ! command -v docker >/dev/null 2>&1; then
              echo 'ERROR: docker not found.'
              exit 1
            fi

            if ! docker compose version >/dev/null 2>&1; then
              echo 'ERROR: docker compose not found.'
              exit 1
            fi

            chmod +x scripts/docker-deploy-prod.sh

            echo ''
            echo '========================================'
            echo 'Building and starting Docker containers (staging)'
            echo '========================================'

            if ! ./scripts/docker-deploy-prod.sh; then
              echo 'ERROR: docker-deploy-prod.sh failed.'
              exit 1
            fi

            echo ''
            echo '========================================'
            echo 'Verifying deployment'
            echo '========================================'

            docker compose -f docker-compose.prod.yml ps

            if ! docker compose -f docker-compose.prod.yml ps --status running | grep -q app; then
              echo 'ERROR: app container is not running'
              docker compose -f docker-compose.prod.yml logs app --tail 50
              exit 1
            fi

            if ! docker compose -f docker-compose.prod.yml ps --status running | grep -q mongo; then
              echo 'ERROR: mongo container is not running'
              docker compose -f docker-compose.prod.yml logs mongo --tail 50
              exit 1
            fi

            if ! docker compose -f docker-compose.prod.yml ps --status running | grep -q lead-jobs; then
              echo 'ERROR: lead-jobs sidecar is not running'
              docker compose -f docker-compose.prod.yml logs lead-jobs --tail 50
              exit 1
            fi

            if ! curl -sf http://127.0.0.1:5411/api/health > /dev/null; then
              echo 'App not ready immediately — waiting...'
              ready=0
              for i in \$(seq 1 30); do
                if curl -sf http://127.0.0.1:5411/api/health > /dev/null; then
                  ready=1
                  echo \"✓ App health OK on port 5411 (attempt \$i)\"
                  break
                fi
                echo \"  Attempt \$i/30 — not ready yet, waiting 5s...\"
                sleep 5
              done
              if [ \"\$ready\" -ne 1 ]; then
                echo 'ERROR: app is not responding on port 5411 after 150s'
                docker compose -f docker-compose.prod.yml logs app --tail 100
                exit 1
              fi
            else
              echo '✓ App health OK on port 5411'
            fi

            echo ''
            echo '========================================'
            echo '✓ Staging deployment completed successfully!'
            echo '✓ Staging site: https://ford-stg.tallmancode.co.za (Basic Auth required)'
            echo '========================================'
          "
