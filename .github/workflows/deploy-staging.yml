name: Deploy Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      run_go_live_cutover:
        description: 'Run go-live cutover (backup + env + nginx + rebuild)'
        type: boolean
        default: false
      skip_nginx:
        description: 'When cutting over, skip nginx/aaPanel vhost changes'
        type: boolean
        default: false
      skip_rebuild:
        description: 'When cutting over, skip Docker image rebuild'
        type: boolean
        default: false
      run_fix_live_proxy:
        description: 'Only diagnose/fix nginx proxy for www+apex -> :4411 (no full cutover)'
        type: boolean
        default: false

env:
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45

    steps:
      - name: Validate required secrets
        env:
          _SSH_KEY: ${{ secrets.SSH_KEY }}
          _SSH_HOST: ${{ secrets.SSH_HOST }}
          _SSH_USER: ${{ secrets.SSH_USER }}
          _APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          missing=0
          if [ -z "$_SSH_KEY" ]; then
            echo "::error::Missing SSH_KEY (set on the staging environment or repository secrets)"
            missing=1
          fi
          if [ -z "$_SSH_HOST" ]; then
            echo "::error::Missing SSH_HOST (set on the staging environment or repository secrets)"
            missing=1
          fi
          if [ -z "$_SSH_USER" ]; then
            echo "::error::Missing SSH_USER (set on the staging environment or repository secrets)"
            missing=1
          fi
          if [ -z "$_APP_ENV" ]; then
            echo "::error::Missing APP_ENV (set on the staging environment or repository secrets)"
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1

      # webfactory/ssh-agent v0.10.0 — pinned to full commit SHA
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add server to known hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to Server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          APP_ENV: ${{ secrets.APP_ENV }}
          APP_DIR: ${{ secrets.APP_DIR || '/www/wwwroot' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -e

          SSH_OPTS="-p $SSH_PORT"
          SCP_OPTS="-P $SSH_PORT"
          DEPLOY_BRANCH="staging"
          ENV_FILE="$(mktemp)"
          trap 'rm -f "$ENV_FILE"' EXIT

          printf '%s\n' "$APP_ENV" > "$ENV_FILE"
          if [ ! -s "$ENV_FILE" ]; then
            echo "::error::Failed to write APP_ENV to temp file"
            exit 1
          fi
          if grep -q '^PAYLOAD_CONFIG_PATH=' "$ENV_FILE"; then
            echo "::error::PAYLOAD_CONFIG_PATH must not be set in APP_ENV for Docker deploy."
            echo "::error::Remove it from the staging environment secret — the container resolves config via @payload-config at /app."
            exit 1
          fi

          echo "========================================"
          echo "Syncing repository on $APP_DIR"
          echo "========================================"

          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "
            set -e

            # Source shell profile to ensure PATH includes docker
            [ -f ~/.bashrc ] && source ~/.bashrc || true
            [ -f ~/.bash_profile ] && source ~/.bash_profile || true
            [ -f ~/.profile ] && source ~/.profile || true

            SERVER_PATH='$APP_DIR'

            git config --global --add safe.directory \"\$SERVER_PATH\"

            if [ ! -d \"\$SERVER_PATH/.git\" ]; then
              echo 'Cloning repository...'
              if [ -d \"\$SERVER_PATH\" ] && [ -w \"\$SERVER_PATH\" ]; then
                rm -rf \"\$SERVER_PATH\"
              elif [ -d \"\$SERVER_PATH\" ]; then
                echo 'Warning: Cannot remove existing directory, will attempt to clone into it'
                if [ -d \"\$SERVER_PATH/.git\" ]; then
                  echo 'Git directory already exists, skipping clone'
                  cd \"\$SERVER_PATH\"
                else
                  echo 'ERROR: Directory exists but is not a git repository and cannot be removed'
                  exit 1
                fi
              fi
              if [ ! -d \"\$SERVER_PATH/.git\" ]; then
                mkdir -p \"\$SERVER_PATH\"
                git clone git@github.com:$GITHUB_REPOSITORY.git \"\$SERVER_PATH\"
                cd \"\$SERVER_PATH\"
                git checkout '$DEPLOY_BRANCH' || git checkout -b '$DEPLOY_BRANCH' origin/'$DEPLOY_BRANCH'
              fi
            else
              echo 'Pulling latest changes...'
              cd \"\$SERVER_PATH\"
              git fetch origin
              git reset --hard origin/'$DEPLOY_BRANCH'
            fi

            echo 'Repository updated successfully'
          "

          echo 'Uploading .env to server...'
          scp $SCP_OPTS "$ENV_FILE" "$SSH_USER@$SSH_HOST:$APP_DIR/.env"
          echo "✓ .env file uploaded"

          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "
            set -e

            [ -f ~/.bashrc ] && source ~/.bashrc || true
            [ -f ~/.bash_profile ] && source ~/.bash_profile || true
            [ -f ~/.profile ] && source ~/.profile || true

            cd '$APP_DIR'

            # Go-live: keep public URL + indexing + Motor City stock URL on every deploy
            # so a stale APP_ENV secret cannot silently revert the site to staging.
            if [ -f .env ]; then
              for pair in \
                'NEXT_PUBLIC_SERVER_URL=https://www.eagleford.co.za' \
                'ALLOW_SEARCH_INDEXING=true' \
                'SENTRY_ENVIRONMENT=production' \
                'NEXT_PUBLIC_SENTRY_ENVIRONMENT=production' \
                'MOTOR_CITY_STOCK_API_URL=https://www.eaglemotorcity.co.za'
              do
                key=\${pair%%=*}
                val=\${pair#*=}
                if grep -q \"^\${key}=\" .env; then
                  sed -i \"s|^\${key}=.*|\${key}=\${val}|\" .env
                else
                  printf '\\n%s=%s\\n' \"\$key\" \"\$val\" >> .env
                fi
              done
              echo '✓ Go-live env overrides applied'
            fi

            if ! command -v docker >/dev/null 2>&1; then
              echo 'ERROR: docker not found. Install Docker on the VPS and add the deploy user to the docker group.'
              exit 1
            fi

            if ! docker compose version >/dev/null 2>&1; then
              echo 'ERROR: docker compose not found. Install the Docker Compose plugin.'
              exit 1
            fi

            echo \"Docker version: \$(docker --version)\"
            echo \"Compose version: \$(docker compose version)\"

            chmod +x scripts/docker-deploy-prod.sh
            chmod +x scripts/go-live-cutover.sh 2>/dev/null || true
            chmod +x scripts/fix-live-proxy.sh 2>/dev/null || true

            if [ '${{ inputs.run_fix_live_proxy }}' = 'true' ]; then
              echo ''
              echo '========================================'
              echo 'Fixing live nginx proxy (www/apex -> :4411)'
              echo '========================================'
              ./scripts/fix-live-proxy.sh
            elif [ '${{ inputs.run_go_live_cutover }}' = 'true' ]; then
              echo ''
              echo '========================================'
              echo 'Running go-live cutover (backup + proxy + rebuild)'
              echo '========================================'
              SKIP_NGINX=0
              SKIP_REBUILD=0
              if [ '${{ inputs.skip_nginx }}' = 'true' ]; then
                SKIP_NGINX=1
              fi
              if [ '${{ inputs.skip_rebuild }}' = 'true' ]; then
                SKIP_REBUILD=1
              fi
              CANONICAL_URL='https://www.eagleford.co.za' \
              SKIP_NGINX=\"\$SKIP_NGINX\" \
              SKIP_REBUILD=\"\$SKIP_REBUILD\" \
                ./scripts/go-live-cutover.sh
            else
              echo ''
              echo '========================================'
              echo 'Building and starting Docker containers'
              echo '========================================'

              if ! ./scripts/docker-deploy-prod.sh; then
                echo 'ERROR: docker-deploy-prod.sh failed. Check the output above.'
                exit 1
              fi
            fi

            echo ''
            echo '========================================'
            echo 'Verifying deployment'
            echo '========================================'

            docker compose -f docker-compose.prod.yml ps

            if ! docker compose -f docker-compose.prod.yml ps --status running | grep -q app; then
              echo 'ERROR: app container is not running'
              docker compose -f docker-compose.prod.yml logs app --tail 50
              exit 1
            fi

            if ! docker compose -f docker-compose.prod.yml ps --status running | grep -q mongo; then
              echo 'ERROR: mongo container is not running'
              docker compose -f docker-compose.prod.yml logs mongo --tail 50
              exit 1
            fi

            # Probe /api/health — \`/\` 404s on an empty CMS and fails curl -f
            if ! curl -sf http://127.0.0.1:4411/api/health > /dev/null; then
              echo 'App not ready immediately — waiting for startup (Next.js can take up to 2 minutes)...'
              ready=0
              for i in \$(seq 1 30); do
                if curl -sf http://127.0.0.1:4411/api/health > /dev/null; then
                  ready=1
                  echo \"✓ App health OK on port 4411 (attempt \$i)\"
                  break
                fi
                echo \"  Attempt \$i/30 — not ready yet, waiting 5s...\"
                sleep 5
              done
              if [ \"\$ready\" -ne 1 ]; then
                echo 'ERROR: app is not responding on port 4411 after 150s'
                docker compose -f docker-compose.prod.yml logs app --tail 100
                exit 1
              fi
            else
              echo '✓ App health OK on port 4411'
            fi

            echo ''
            echo '========================================'
            echo '✓ Staging deployment completed successfully!'
            echo '✓ App and mongo containers are running'
            echo '========================================'
          "
