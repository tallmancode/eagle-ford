name: Deploy Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

env:
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: 1

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: mongodb://127.0.0.1:27017/eagle-ford-ci
      NEXT_PUBLIC_SERVER_URL: http://localhost:3001
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ci-server-actions-encryption-key
      PAYLOAD_SECRET: ci-payload-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.8.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: |
          pnpm exec tsc --noEmit
          pnpm lint
          pnpm test:int

  deploy-staging:
    needs: quality
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30

    steps:
      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.SSH_KEY }}" ]; then
            echo "::error::Missing SSH_KEY (set on the staging environment or repository secrets)"
            exit 1
          fi
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "::error::Missing SSH_HOST (set on the staging environment or repository secrets)"
            exit 1
          fi
          if [ -z "${{ secrets.SSH_USER }}" ]; then
            echo "::error::Missing SSH_USER (set on the staging environment or repository secrets)"
            exit 1
          fi
          if [ -z "${{ secrets.APP_ENV }}" ]; then
            echo "::error::Missing APP_ENV (set on the staging environment or repository secrets)"
            exit 1
          fi
          if [ -z "${{ secrets.SSH_KNOWN_HOSTS }}" ]; then
            echo "::error::Missing SSH_KNOWN_HOSTS (set the staging server's pinned SSH host key)"
            exit 1
          fi

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Configure known hosts
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to Server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          APP_ENV: ${{ secrets.APP_ENV }}
          APP_DIR: ${{ secrets.APP_DIR || '/www/wwwroot' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEPLOY_REVISION: ${{ github.sha }}
        run: |
          set -e

          SSH_OPTS="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -p $SSH_PORT"
          SCP_OPTS="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -P $SSH_PORT"
          DEPLOY_BRANCH="staging"
          ENV_FILE="$(mktemp)"
          trap 'rm -f "$ENV_FILE"' EXIT

          printf '%s\n' "$APP_ENV" > "$ENV_FILE"
          if [ ! -s "$ENV_FILE" ]; then
            echo "::error::Failed to write APP_ENV to temp file"
            exit 1
          fi
          if grep -q '^PAYLOAD_CONFIG_PATH=' "$ENV_FILE"; then
            echo "::error::PAYLOAD_CONFIG_PATH must not be set in APP_ENV for Docker deploy."
            echo "::error::Remove it from the staging environment secret — the container resolves config via @payload-config at /app."
            exit 1
          fi
          for key in DATABASE_URL BUILD_DATABASE_URL NEXT_PUBLIC_SERVER_URL PAYLOAD_SECRET NEXT_SERVER_ACTIONS_ENCRYPTION_KEY; do
            if ! grep -q "^${key}=." "$ENV_FILE"; then
              echo "::error::APP_ENV must define ${key}"
              exit 1
            fi
          done

          echo "========================================"
          echo "Syncing repository on $APP_DIR"
          echo "========================================"

          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "
            set -e

            # Source shell profile to ensure PATH includes docker
            [ -f ~/.bashrc ] && source ~/.bashrc || true
            [ -f ~/.bash_profile ] && source ~/.bash_profile || true
            [ -f ~/.profile ] && source ~/.profile || true

            SERVER_PATH='$APP_DIR'

            if [ ! -d \"\$SERVER_PATH/.git\" ]; then
              echo 'Cloning repository...'
              if [ -d \"\$SERVER_PATH\" ] && [ -w \"\$SERVER_PATH\" ]; then
                rm -rf \"\$SERVER_PATH\"
              elif [ -d \"\$SERVER_PATH\" ]; then
                echo 'Warning: Cannot remove existing directory, will attempt to clone into it'
                if [ -d \"\$SERVER_PATH/.git\" ]; then
                  echo 'Git directory already exists, skipping clone'
                  cd \"\$SERVER_PATH\"
                else
                  echo 'ERROR: Directory exists but is not a git repository and cannot be removed'
                  exit 1
                fi
              fi
              if [ ! -d \"\$SERVER_PATH/.git\" ]; then
                mkdir -p \"\$SERVER_PATH\"
                git clone git@github.com:$GITHUB_REPOSITORY.git \"\$SERVER_PATH\"
                git -C \"\$SERVER_PATH\" -c safe.directory=\"\$SERVER_PATH\" checkout '$DEPLOY_BRANCH' || \
                  git -C \"\$SERVER_PATH\" -c safe.directory=\"\$SERVER_PATH\" checkout -b '$DEPLOY_BRANCH' origin/'$DEPLOY_BRANCH'
              fi
            else
              echo 'Pulling latest changes...'
              git -C \"\$SERVER_PATH\" -c safe.directory=\"\$SERVER_PATH\" fetch origin '$DEPLOY_BRANCH'
              git -C \"\$SERVER_PATH\" -c safe.directory=\"\$SERVER_PATH\" reset --hard origin/'$DEPLOY_BRANCH'
            fi

            echo 'Repository updated successfully'
          "

          echo 'Uploading .env to server...'
          scp $SCP_OPTS "$ENV_FILE" "$SSH_USER@$SSH_HOST:$APP_DIR/.env"
          echo "✓ .env file uploaded"

          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "
            set -e

            [ -f ~/.bashrc ] && source ~/.bashrc || true
            [ -f ~/.bash_profile ] && source ~/.bash_profile || true
            [ -f ~/.profile ] && source ~/.profile || true

            cd '$APP_DIR'

            if ! command -v docker >/dev/null 2>&1; then
              echo 'ERROR: docker not found. Install Docker on the VPS and add the deploy user to the docker group.'
              exit 1
            fi

            if ! docker compose version >/dev/null 2>&1; then
              echo 'ERROR: docker compose not found. Install the Docker Compose plugin.'
              exit 1
            fi

            echo \"Docker version: \$(docker --version)\"
            echo \"Compose version: \$(docker compose version)\"

            export DOCKER_BUILDKIT=1
            chmod +x scripts/docker-deploy-prod.sh

            echo ''
            echo '========================================'
            echo 'Building and starting Docker containers'
            echo '========================================'

            if ! DEPLOY_REVISION='$DEPLOY_REVISION' ./scripts/docker-deploy-prod.sh; then
              echo 'ERROR: docker-deploy-prod.sh failed. Check the output above.'
              exit 1
            fi

            echo ''
            echo '========================================'
            echo 'Verifying deployment'
            echo '========================================'

            docker compose -f docker-compose.prod.yml ps

            if [ -z \"\$(docker compose -f docker-compose.prod.yml ps --status running -q app)\" ]; then
              echo 'ERROR: app container is not running'
              docker compose -f docker-compose.prod.yml logs app --tail 50
              exit 1
            fi

            if [ -z \"\$(docker compose -f docker-compose.prod.yml ps --status running -q mongo)\" ]; then
              echo 'ERROR: mongo container is not running'
              docker compose -f docker-compose.prod.yml logs mongo --tail 50
              exit 1
            fi

            APP_HOST_PORT=\"\$(awk -F= '/^APP_HOST_PORT=/{print \$2; exit}' .env | tr -d '\\r')\"
            APP_HOST_PORT=\"\${APP_HOST_PORT:-4411}\"

            if ! curl -sf \"http://127.0.0.1:\${APP_HOST_PORT}/api/health\" > /dev/null; then
              echo 'App not ready immediately — waiting for startup (Next.js can take up to 2 minutes)...'
              ready=0
              for i in \$(seq 1 30); do
                if curl -sf \"http://127.0.0.1:\${APP_HOST_PORT}/api/health\" > /dev/null; then
                  ready=1
                  echo \"✓ App health check responded on port \${APP_HOST_PORT} (attempt \$i)\"
                  break
                fi
                echo \"  Attempt \$i/30 — not ready yet, waiting 5s...\"
                sleep 5
              done
              if [ \"\$ready\" -ne 1 ]; then
                echo \"ERROR: app health check is not responding on port \${APP_HOST_PORT} after 150s\"
                docker compose -f docker-compose.prod.yml logs app --tail 100
                exit 1
              fi
            else
              echo \"✓ App health check responded on port \${APP_HOST_PORT}\"
            fi

            echo ''
            echo '========================================'
            echo '✓ Staging deployment completed successfully!'
            echo '✓ App and mongo containers are running'
            echo '========================================'
          "
