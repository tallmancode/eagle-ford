name: CI

# TEMPORARY (fast main workflow): heavy CI disabled so PRs/merges are not blocked
# waiting on lint/typecheck/tests. Re-enable the full job matrix when returning to
# develop → staging → main promotion. Deploy still runs on push to main.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: CI skipped (temporary fast-main mode)
        run: |
          echo "CI checks are temporarily disabled."
          echo "Re-enable pull_request triggers and the full lint/typecheck/test job when leaving fast-main mode."
