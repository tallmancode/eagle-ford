# eagle-ford-dev.tallmancode.co.za — permanent redirect to the live site.
#
# Apply in aaPanel: Sites → eagle-ford-dev.tallmancode.co.za → Config tab.
# Keep DNS for this hostname pointing at the VPS so Let's Encrypt can renew
# the certificate and the redirect itself works over HTTPS.

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name eagle-ford-dev.tallmancode.co.za;

    ssl_certificate     /www/server/panel/vhost/cert/eagle-ford-dev.tallmancode.co.za/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/eagle-ford-dev.tallmancode.co.za/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Required for Let's Encrypt certificate renewal
    include /www/server/panel/vhost/nginx/well-known/eagle-ford-dev.tallmancode.co.za.conf;

    return 301 https://www.eagleford.co.za$request_uri;
}
