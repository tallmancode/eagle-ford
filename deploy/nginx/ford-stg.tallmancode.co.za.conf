# ford-stg.tallmancode.co.za — staging reverse proxy (Basic Auth gated).
#
# Apply in aaPanel after DNS + SSL. Shared htpasswd (nginx worker-readable path):
#   htpasswd -c -B /www/server/nginx/conf/eagle-staging.htpasswd eagle
#   chown root:www /www/server/nginx/conf/eagle-staging.htpasswd
#   chmod 640 /www/server/nginx/conf/eagle-staging.htpasswd
#
# Payload/Next return 401 for unauthenticated admin/API calls. After nginx Basic
# Auth succeeds the browser still sends Authorization: Basic on every request, so
# those app 401s look like "wrong staging password" and Chrome/Edge re-prompt.
# Strip Basic from upstream and map app 401 → 403. Keep nginx's own 401 challenge.

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name ford-stg.tallmancode.co.za;
    root /www/wwwroot/ford-stg.tallmancode.co.za;

    include /www/server/panel/vhost/nginx/well-known/ford-stg.tallmancode.co.za.conf;

    ssl_certificate     /www/server/panel/vhost/cert/ford-stg.tallmancode.co.za/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/ford-stg.tallmancode.co.za/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic           "Eagle staging";
    auth_basic_user_file /www/server/nginx/conf/eagle-staging.htpasswd;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /www/wwwroot/ford-stg.tallmancode.co.za;
    }

    if ($host ~* "^[0-9.]+$") { return 444; }

    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:5411;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization "";
        proxy_hide_header WWW-Authenticate;
        proxy_intercept_errors on;
        error_page 401 = @stg_app_unauthorized;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ^~ /admin {
        proxy_pass http://127.0.0.1:5411;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization "";
        proxy_hide_header WWW-Authenticate;
        proxy_intercept_errors on;
        error_page 401 = @stg_app_unauthorized;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5411;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization "";
        proxy_hide_header WWW-Authenticate;
        proxy_intercept_errors on;
        error_page 401 = @stg_app_unauthorized;
    }

    location / {
        proxy_pass http://127.0.0.1:5411;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization "";
        proxy_hide_header WWW-Authenticate;
        proxy_intercept_errors on;
        error_page 401 = @stg_app_unauthorized;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
    }

    location @stg_app_unauthorized {
        internal;
        default_type application/json;
        if ($upstream_status ~ ^401) {
            return 403 '{"errors":[{"message":"Unauthorized"}]}';
        }
        add_header WWW-Authenticate 'Basic realm="Eagle staging"' always;
        return 401;
    }

    access_log /www/wwwlogs/ford-stg.tallmancode.co.za.log;
    error_log  /www/wwwlogs/ford-stg.tallmancode.co.za.error.log;
}
