server
{
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name eagle-ford-dev.tallmancode.co.za;
    index index.html index.htm;
    root /www/wwwroot/eagle-ford-dev.tallmancode.co.za;
    include /www/server/panel/vhost/nginx/extension/eagle-ford-dev.tallmancode.co.za/*.conf;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/eagle-ford-dev.tallmancode.co.za.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START
    #error_page 404/404.html;
    ssl_certificate    /www/server/panel/vhost/cert/eagle-ford-dev.tallmancode.co.za/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/eagle-ford-dev.tallmancode.co.za/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:!aNULL:!eNULL:!MD5:!DSS:!3DES;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    error_page 497 https://$host$request_uri;
    #SSL-END

    # Compression — gzip (always)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2
        application/font-woff
        application/font-woff2;

    # BROTLI — uncomment only if ngx_brotli is loaded (`nginx -V 2>&1 | grep brotli`)
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types
    #     text/plain
    #     text/css
    #     text/javascript
    #     application/javascript
    #     application/json
    #     application/ld+json
    #     application/xml
    #     image/svg+xml
    #     font/woff2;

    #ERROR-PAGE-START
    error_page 404 /404.html;
    error_page 502 /502.html;
    #ERROR-PAGE-END

    # PHP removed — Next.js app only (do not re-add enable-php-*.conf)

    #REWRITE-START
    include /www/server/panel/vhost/rewrite/eagle-ford-dev.tallmancode.co.za.conf;
    #REWRITE-END

    # Reject direct-IP access
    if ($host ~* "^[0-9.]+$") {
        return 444;
    }

    # Reject obvious Server Action probes
    if ($http_next_action ~ "^[a-zA-Z]{1,8}$") {
        return 403;
    }

    # Next.js hashed static assets
    location ^~ /_next/static/ {
        proxy_pass http://localhost:4411;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Next.js image optimization
    location ^~ /_next/image {
        proxy_pass http://localhost:4411;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    }

    # Admin — never cache; long timeouts for uploads
    location ^~ /admin {
        proxy_pass http://localhost:4411;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        proxy_cache_bypass 1;
        proxy_no_cache 1;
    }

    # API — never cache
    location ^~ /api/ {
        proxy_pass http://localhost:4411;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        add_header Cache-Control "no-store, must-revalidate" always;

        proxy_cache_bypass 1;
        proxy_no_cache 1;
    }

    # Public static-ish routes from Next (favicon, robots, sitemap, fonts, images)
    location ~ ^/(favicon\.ico|robots\.txt|sitemap\.xml|.*\.(jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf|eot))$ {
        proxy_pass http://localhost:4411;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        access_log off;
    }

    # HTML + dynamic routes — let Next control Cache-Control
    location / {
        proxy_pass http://localhost:4411;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Real-Port $remote_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_pass_header Cache-Control;
        proxy_buffering on;

        proxy_cache_bypass 1;
        proxy_no_cache 1;
    }

    # Forbidden files
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    access_log  /www/wwwlogs/eagle-ford-dev.tallmancode.co.za.log;
    error_log  /www/wwwlogs/eagle-ford-dev.tallmancode.co.za.error.log;
}
